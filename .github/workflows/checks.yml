name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu stands in for Kylin; 3.8 is the Python Kylin V10 ships
          - {os: ubuntu-latest, python: "3.8"}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Repository checks
        run: python scripts/check_repo.py
      - name: Shared copies are current
        run: python scripts/sync_shared.py --check
      - name: Converter is a copy of the doc2kb release named in DOC2KB_VERSION
        # The release's files are only read and compared, never run.
        run: |
          v=$(tr -d '[:space:]' < DOC2KB_VERSION)
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "DOC2KB_VERSION does not hold a version X.Y.Z"; exit 1
          fi
          git clone --quiet --depth 1 --branch "v$v" https://github.com/walkwithedi/doc2kb .doc2kb
          python scripts/sync_doc2kb.py --check .doc2kb
      - name: Build zips
        run: python scripts/build_skill.py && python scripts/build_skill.py --locale zh
  scan:
    # Logs of this public repository are public: the scanner prints only file:line and the rule
    # under GitHub Actions, and gitleaks runs with --redact.
    runs-on: ubuntu-latest
    env:
      # Private terms (employer, system and people names) from the repository secret; empty on
      # pull requests from forks, which then get every check except this one.
      SENSITIVE_TERMS: ${{ secrets.SENSITIVE_TERMS }}
      GITLEAKS_VERSION: v8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Sensitive data (whole tree, file names and metadata)
        run: python scripts/sensitive_scan.py
      - name: Sensitive data (new commits - lines, messages, identities, images)
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.event.after) }}
        run: |
          # After a history rewrite the old and new commits share no ancestor; the whole-tree
          # scan above and gitleaks below still cover the result.
          if ! git merge-base "${RANGE%%..*}" "${RANGE##*..}" >/dev/null 2>&1; then
            echo "no common ancestor in $RANGE (history rewritten): range scan skipped"; exit 0
          fi
          python scripts/sensitive_scan.py --range "$RANGE"
      - name: Credentials (gitleaks, all of history)
        # Installed through the Go module proxy: the version is pinned and its checksum is
        # verified against sum.golang.org.
        run: |
          go install "github.com/zricethezav/gitleaks/v8@$GITLEAKS_VERSION"
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner --log-opts=--all .
