name: release
# Publishes the version in the SKILL.md "Version:" lines, the way edi-lab's tools-release does:
#   push to main       releases v<version> if that release does not exist yet, so merging a
#                      version bump is all a release takes (other pushes to main are skipped)
#   workflow_dispatch  the same check, run by hand (Actions > release > Run workflow); with
#                      refresh_notes on, an existing release of the version gets its notes
#                      rewritten from CHANGELOG.md (zips and tag stay as they are)
#   push of a v* tag,  still supported; the tag must match the version
#   release published  on the web: the zips are attached to that release
# The release and its tag are created by this workflow through the API, so nobody needs
# permission to push tags. Runs are queued one at a time and every step is idempotent.
on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      refresh_notes:
        description: Rewrite the notes of an existing release from CHANGELOG.md
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Decide
        id: decide
        env:
          REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_notes }}
        run: |
          v=$(grep -m1 -oE '^Version: [0-9.]+' skills/kb-note/SKILL.md | cut -d' ' -f2)
          tag="v$v"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$tag" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match skills version $v"; exit 1
          fi
          run=true
          refresh=false
          if [ "${GITHUB_REF_TYPE}" = "branch" ] && gh release view "$tag" >/dev/null 2>&1; then
            run=false
            if [ "$REFRESH" = "true" ]; then
              echo "$tag is already released; rewriting its notes"
              refresh=true
            else
              echo "$tag is already released; nothing to do"
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "refresh=$refresh" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        if: steps.decide.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: Check
        if: steps.decide.outputs.run == 'true'
        run: |
          python -m unittest discover -s tests
          python scripts/check_repo.py
          python scripts/sync_shared.py --check
          python scripts/sensitive_scan.py
      - name: Build
        if: steps.decide.outputs.run == 'true'
        env:
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          python scripts/build_skill.py
          python scripts/build_skill.py --locale zh
          python scripts/build_skill.py --chatgpt
          git archive --format=zip --prefix=evergreen-wiki/ -o "dist/evergreen-wiki-${TAG}.zip" HEAD
          # the stand-alone converter, for machines that only need tools/doc2kb
          git archive --format=zip --prefix=doc2kb/ -o "dist/doc2kb-${TAG}.zip" HEAD:tools/doc2kb
      - name: Notes
        if: steps.decide.outputs.run == 'true' || steps.decide.outputs.refresh == 'true'
        env:
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          awk "/^## ${TAG#v}/{f=1;next} /^## /{f=0} f" CHANGELOG.md > notes.md
          # the same download guide under every release, with this version filled in
          { echo; sed "s/<version>/${TAG#v}/g" docs/release-downloads.md; } >> notes.md
      - name: Refresh notes
        if: steps.decide.outputs.refresh == 'true'
        env:
          TAG: ${{ steps.decide.outputs.tag }}
        run: gh release edit "$TAG" --notes-file notes.md
      - name: Publish
        if: steps.decide.outputs.run == 'true'
        env:
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Already there (published on the web): attach the zips, fill in empty notes.
            gh release upload "$TAG" dist/*.zip --clobber
            if [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
              gh release edit "$TAG" --notes-file notes.md
            fi
          else
            # Creates the tag on the commit being built.
            gh release create "$TAG" dist/*.zip --target "${GITHUB_SHA}" --title "$TAG" --notes-file notes.md
          fi
